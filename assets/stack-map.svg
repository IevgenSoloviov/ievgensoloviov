<svg width="1200" height="580"
     viewBox="0 0 1200 580"
     xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#050816"/>
  <stop offset="100%" stop-color="#0F172A"/>
</linearGradient>

<filter id="shadow">
  <feDropShadow dx="0" dy="6"
                stdDeviation="8"
                flood-opacity="0.4"/>
</filter>

</defs>

<rect width="1200" height="580"
      rx="24"
      fill="url(#bg)"/>

<!-- TITLE -->

<text x="50" y="55"
      fill="#58A6FF"
      font-family="monospace"
      font-size="15"
      letter-spacing="2">
  IEVGEN // TECH ARCHITECTURE
</text>

<text x="50" y="90"
      fill="#F8FAFC"
      font-family="Arial"
      font-size="25"
      font-weight="700">
  My technical universe
</text>

<!-- CONNECTIONS -->

<g stroke="#334155"
   stroke-width="2">

<line x1="600" y1="290" x2="300" y2="180"/>
<line x1="600" y1="290" x2="900" y2="180"/>
<line x1="600" y1="290" x2="300" y2="420"/>
<line x1="600" y1="290" x2="900" y2="420"/>

</g>

<!-- CENTER -->

<circle cx="600"
        cy="290"
        r="90"
        fill="#111827"
        stroke="#58A6FF"
        stroke-width="3"
        filter="url(#shadow)"/>

<text x="600" y="275"
      text-anchor="middle"
      fill="#F8FAFC"
      font-family="Arial"
      font-size="23"
      font-weight="700">
  IEVGEN
</text>

<text x="600" y="305"
      text-anchor="middle"
      fill="#58A6FF"
      font-family="monospace"
      font-size="13">
  SYSTEM PROFILE
</text>

<text x="600" y="330"
      text-anchor="middle"
      fill="#64748B"
      font-family="monospace"
      font-size="12">
  BUILD 2026
</text>

<!-- SYSTEMS -->

<rect x="90" y="115"
      width="420" height="135"
      rx="16"
      fill="#0F172A"
      stroke="#1F6FEB"/>

<text x="120" y="150"
      fill="#58A6FF"
      font-family="monospace"
      font-size="14">
  01 // SYSTEMS + NETWORK
</text>

<text x="120" y="185"
      fill="#E2E8F0"
      font-family="Arial"
      font-size="16">
  Linux · Windows Server · Active Directory
</text>

<text x="120" y="212"
      fill="#94A3B8"
      font-family="Arial"
      font-size="15">
  DNS · DHCP · VLAN · TCP/IP · pfSense
</text>

<!-- CLOUD -->

<rect x="690" y="115"
      width="420" height="135"
      rx="16"
      fill="#0F172A"
      stroke="#8957E5"/>

<text x="720" y="150"
      fill="#D2A8FF"
      font-family="monospace"
      font-size="14">
  02 // CLOUD NATIVE
</text>

<text x="720" y="185"
      fill="#E2E8F0"
      font-family="Arial"
      font-size="16">
  Docker · Swarm · Kubernetes · Helm
</text>

<text x="720" y="212"
      fill="#94A3B8"
      font-family="Arial"
      font-size="15">
  Istio · Ingress · HPA · Microservices
</text>

<!-- AUTOMATION -->

<rect x="90" y="355"
      width="420" height="135"
      rx="16"
      fill="#0F172A"
      stroke="#2DD4BF"/>

<text x="120" y="390"
      fill="#5EEAD4"
      font-family="monospace"
      font-size="14">
  03 // AUTOMATION + OPS
</text>

<text x="120" y="425"
      fill="#E2E8F0"
      font-family="Arial"
      font-size="16">
  Bash · PowerShell · Git · GitHub
</text>

<text x="120" y="452"
      fill="#94A3B8"
      font-family="Arial"
      font-size="15">
  YAML · Monitoring · Infrastructure
</text>

<!-- DATA -->

<rect x="690" y="355"
      width="420" height="135"
      rx="16"
      fill="#0F172A"
      stroke="#D29922"/>

<text x="720" y="390"
      fill="#E3B341"
      font-family="monospace"
      font-size="14">
  04 // DATA + INTELLIGENCE
</text>

<text x="720" y="425"
      fill="#E2E8F0"
      font-family="Arial"
      font-size="16">
  Python · SQL · PostgreSQL · MySQL
</text>

<text x="720" y="452"
      fill="#94A3B8"
      font-family="Arial"
      font-size="15">
  Big Data · Analytics · Artificial Intelligence
</text>

<!-- FOOTER -->

<text x="600" y="545"
      text-anchor="middle"
      fill="#475569"
      font-family="monospace"
      font-size="13">
  INFRASTRUCTURE → AUTOMATION → DATA → INTELLIGENCE
</text>

</svg>
