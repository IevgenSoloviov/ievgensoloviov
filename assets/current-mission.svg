<svg width="1200" height="620" viewBox="0 0 1200 620"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="52%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="coreGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="50%" stop-color="#8957E5"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <linearGradient id="bluePurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#8957E5"/>
    </linearGradient>

    <linearGradient id="purpleTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8957E5"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#1E293B"
            stroke-width="1"/>
    </pattern>

    <!-- Glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


