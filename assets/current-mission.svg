  <!-- BACKGROUND                                            -->
  <!-- ===================================================== -->

  <rect width="1200"
        height="620"
        rx="26"
        fill="url(#bg)"/>

  <rect width="1200"
        height="620"
        rx="26"
        fill="url(#grid)"
        opacity="0.22"/>


