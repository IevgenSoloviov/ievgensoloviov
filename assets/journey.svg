<svg width="1200" height="420" viewBox="0 0 1200 420"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="timeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="35%" stop-color="#58A6FF"/>
      <stop offset="68%" stop-color="#8957E5"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <filter id="blueGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#1E293B"
            stroke-width="1"/>
    </pattern>

  </defs>

  <!-- BACKGROUND -->

  <rect width="1200" height="420"
        rx="24"
        fill="url(#bg)"/>

  <rect width="1200" height="420"
        rx="24"
        fill="url(#grid)"
        opacity="0.25"/>

  <!-- HEADER -->

  <text x="55" y="55"
        fill="#58A6FF"
        font-family="monospace"
        font-size="14"
        letter-spacing="3">
    02 // SYSTEM EVOLUTION
  </text>

  <text x="55" y="92"
        fill="#F8FAFC"
        font-family="Arial, sans-serif"
        font-size="28"
        font-weight="700">
    From infrastructure foundations to intelligent systems
  </text>

  <text x="55" y="120"
        fill="#64748B"
        font-family="monospace"
        font-size="13">
    HARDWARE → SYSTEMS → CLOUD NATIVE → DATA &amp; AI
  </text>

  <!-- TIMELINE -->

  <line x1="120" y1="215"
        x2="1080" y2="215"
        stroke="url(#timeline)"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- NODE 1 -->

  <circle cx="150" cy="215" r="13"
          fill="#0F172A"
          stroke="#94A3B8"
          stroke-width="4"/>

  <text x="150" y="181"
        text-anchor="middle"
        fill="#94A3B8"
        font-family="monospace"
        font-size="13">
    2022
  </text>

  <text x="150" y="265"
        text-anchor="middle"
        fill="#F8FAFC"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="700">
    SMX
  </text>

  <text x="150" y="291"
        text-anchor="middle"
        fill="#94A3B8"
        font-family="Arial, sans-serif"
        font-size="13">
    Technical Foundations
  </text>

  <text x="150" y="323"
        text-anchor="middle"
        fill="#64748B"
        font-family="monospace"
        font-size="11">
    HARDWARE · SUPPORT
  </text>

  <text x="150" y="342"
        text-anchor="middle"
        fill="#64748B"
        font-family="monospace"
        font-size="11">
    NETWORKING
  </text>

  <!-- NODE 2 -->

  <circle cx="445" cy="215" r="14"
          fill="#58A6FF"
          stroke="#79C0FF"
          stroke-width="3"
          filter="url(#blueGlow)"/>

  <text x="445" y="181"
        text-anchor="middle"
        fill="#79C0FF"
        font-family="monospace"
        font-size="13">
    2024
  </text>

  <text x="445" y="265"
        text-anchor="middle"
        fill="#F8FAFC"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="700">
    ASIR
  </text>

  <text x="445" y="291"
        text-anchor="middle"
        fill="#79C0FF"
        font-family="Arial, sans-serif"
        font-size="13">
    Systems &amp; Infrastructure
  </text>

  <text x="445" y="323"
        text-anchor="middle"
        fill="#64748B"
        font-family="monospace"
        font-size="11">
    LINUX · WINDOWS · AD
  </text>

  <text x="445" y="342"
        text-anchor="middle"
        fill="#64748B"
        font-family="monospace"
        font-size="11">
    NETWORK · SECURITY · DB
  </text>

  <!-- NODE 3 -->

  <circle cx="750" cy="215" r="15"
          fill="#8957E5"
          stroke="#D2A8FF"
          stroke-width="3"
          filter="url(#purpleGlow)"/>

  <text x="750" y="181"
        text-anchor="middle"
        fill="#D2A8FF"
        font-family="monospace"
        font-size="13">
    2026
  </text>

  <text x="750" y="265"
        text-anchor="middle"
        fill="#F8FAFC"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="700">
    CLOUD NATIVE
  </text>

  <text x="750" y="291"
        text-anchor="middle"
        fill="#D2A8FF"
        font-family="Arial, sans-serif"
        font-size="13">
    Modern Infrastructure
  </text>

  <text x="750" y="323"
        text-anchor="middle"
        fill="#64748B"
        font-family="monospace"
        font-size="11">
    DOCKER · KUBERNETES
  </text>

  <text x="750" y="342"
        text-anchor="middle"
        fill="#64748B"
        font-family="monospace"
        font-size="11">
    HELM · ISTIO · OBSERVE
  </text>

  <!-- NODE 4 CURRENT -->

  <circle cx="1050" cy="215" r="17"
          fill="#2DD4BF"
          stroke="#99F6E4"
          stroke-width="3"
          filter="url(#blueGlow)"/>

  <circle cx="1050" cy="215" r="27"
          fill="none"
          stroke="#2DD4BF"
          stroke-width="1"
          opacity="0.35"/>

  <text x="1050" y="173"
        text-anchor="middle"
        fill="#5EEAD4"
        font-family="monospace"
        font-size="12">
    ● CURRENT
  </text>

  <text x="1050" y="265"
        text-anchor="middle"
        fill="#F8FAFC"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="700">
    AI + BIG DATA
  </text>

  <text x="1050" y="291"
        text-anchor="middle"
        fill="#5EEAD4"
        font-family="Arial, sans-serif"
        font-size="13">
    Intelligence Layer
  </text>

  <text x="1050" y="323"
        text-anchor="middle"
        fill="#64748B"
        font-family="monospace"
        font-size="11">
    PYTHON · DATA
  </text>

  <text x="1050" y="342"
        text-anchor="middle"
        fill="#64748B"
        font-family="monospace"
        font-size="11">
    BIG DATA · AI
  </text>

  <!-- FOOTER STATUS -->

  <rect x="455" y="375"
        width="290"
        height="28"
        rx="14"
        fill="#0D2818"
        stroke="#238636"/>

  <circle cx="475" cy="389"
          r="4"
          fill="#3FB950"/>

  <text x="490" y="394"
        fill="#7EE787"
        font-family="monospace"
        font-size="11">
    EVOLUTION STATUS // IN PROGRESS
  </text>

</svg>
