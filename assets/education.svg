<svg width="1200" height="520" viewBox="0 0 1200 520"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Timeline gradient -->
    <linearGradient id="timeline"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="42%" stop-color="#58A6FF"/>
      <stop offset="72%" stop-color="#8957E5"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#1E293B"
            stroke-width="1"/>
    </pattern>

    <!-- Glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND                                            -->
  <!-- ===================================================== -->

  <rect width="1200"
        height="520"
        rx="26"
        fill="url(#bg)"/>

  <rect width="1200"
        height="520"
        rx="26"
        fill="url(#grid)"
        opacity="0.20"/>


  <!-- ===================================================== -->
  <!-- TERMINAL BAR                                          -->
  <!-- ===================================================== -->

  <circle cx="32"
          cy="28"
          r="5"
          fill="#FF5F56"/>

  <circle cx="50"
          cy="28"
          r="5"
